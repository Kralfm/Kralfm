<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue,
set,
onDisconnect
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig={

apiKey:"AIzaSyDvfuuPnoBVhBNyMg1n0iBfsY9J29IwbzA",

authDomain:"kralfm-muhabbet.firebaseapp.com",

databaseURL:"https://kralfm-muhabbet-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"kralfm-muhabbet",

storageBucket:"kralfm-muhabbet.firebasestorage.app",

messagingSenderId:"638769846511",

appId:"1:638769846511:web:f6d8abb91564873996"

};


const app=initializeApp(firebaseConfig);

const db=getDatabase(app);

const messagesRef=ref(db,"messages");

const presenceRef=ref(db,"presence");


const $=id=>document.getElementById(id);

let sound=false;

// Kalıcı UID
let uid = localStorage.getItem("kralfm_uid");
if(!uid){
  uid = "user_" + Math.random().toString(36).slice(2,10);
  localStorage.setItem("kralfm_uid", uid);
}

const notification=$("notificationSound");

const applause=$("applauseSound");

const defaultGuestName=
"Misafir_"+Math.floor(Math.random()*900+100);

// Sayfa yüklendiğinde daha önce kaydedilmiş ad/avatar/renk varsa inputlara doldur
if(localStorage.getItem("kralfm_name")){
  $("name").value = localStorage.getItem("kralfm_name");
}
if(localStorage.getItem("kralfm_avatar")){
  $("userAvatar").value = localStorage.getItem("kralfm_avatar");
}
if(localStorage.getItem("kralfm_color")){
  $("userColor").value = localStorage.getItem("kralfm_color");
}


const staticBots=[

{name:"DuRu",avatar:"👩"},

{name:"Eren",avatar:"👨"},

{name:"LeyLi",avatar:"🌟"},

{name:"RadyoDinliyorum",avatar:"🎧"}

];


function openDrawer(){

$("userDrawer").classList.add("open");

$("drawerOverlay").style.display="block";

}


function closeDrawer(){

$("userDrawer").classList.remove("open");

$("drawerOverlay").style.display="none";

}


$("menuTrigger").onclick=openDrawer;

$("closeDrawer").onclick=closeDrawer;

$("drawerOverlay").onclick=closeDrawer;


/* ===============================
   SOHBET SİSTEMİ
================================ */

function time(t){

return new Date(t||Date.now())
.toLocaleTimeString("tr-TR",{
hour:"2-digit",
minute:"2-digit"
});

}


function appendMessage(d){

const box=$("messages");

if(!box||!d)return;

const r=document.createElement("div");

const ts=document.createElement("span");

ts.className="time";

ts.textContent=
"["+time(d.createdAt)+"] ";


if(d.type==="system"){

r.className="msg system-msg";

r.textContent=
ts.textContent+" "+d.text;

box.appendChild(r);

box.scrollTop=box.scrollHeight;

return;

}


const av=document.createElement("span");

const n=document.createElement("span");

const t=document.createElement("span");


av.className="avatar";

av.textContent=
(d.type==="bot"?"🤖":(d.avatar||"🎧"))+" ";


n.className=
d.type==="bot"?"name bot-name":"name";

n.textContent=
(d.name||"Misafir")+": ";


t.textContent=d.text||"";


if(d.type==="applause")
r.className="msg applause-msg";

else if(d.type==="request")
r.className="msg request-msg";

else if(d.type==="whisper")
r.className="msg whisper-msg";

else if(d.type==="action")
r.className="msg action-msg";

else
r.className=
d.type==="bot"?"msg bot-msg":"msg";


if(d.type==="bot"){

const b=document.createElement("span");

b.className="bot-badge";

b.textContent="BOT";

r.append(ts,b,av,n,t);

}else{

r.append(ts,av,n,t);

}


if(d.type!=="bot"&&d.color)
n.style.color=d.color;


box.appendChild(r);

box.scrollTop=box.scrollHeight;


if(sound){

const snd=
d.type==="applause"
?applause
:notification;

snd.currentTime=0;

snd.play().catch(()=>{});

}

}


onValue(messagesRef,snap=>{

const data=snap.val()||{};

$("messages").innerHTML="";

Object.values(data).forEach(d=>{
appendMessage(d);
});

});


function botReply(text,user){

const m=text.toLowerCase();

if(user.toLowerCase()==="kral bot")
return null;

if(m.includes("selam"))
return "Aleykümselam @"+user+" 👋";

if(m.includes("merhaba"))
return "Merhaba @"+user+"! Kral FM'e hoş geldin. 📻";

if(m.includes("kahve"))
return "☕ Sayın @"+user+", kahveniz hazır! Afiyet olsun.";

if(m.includes("istek"))
return "🎵 İstek mesajınız yayıncıya iletildi. Keyifli dinlemeler!";

return null;

}


async function registerPresence(){

const activeName=
$("name").value.trim()||defaultGuestName;

const activeAvatar=$("userAvatar").value;

const activeColor=$("userColor").value;

localStorage.setItem("kralfm_name", $("name").value.trim());
localStorage.setItem("kralfm_avatar", activeAvatar);
localStorage.setItem("kralfm_color", activeColor);

const uref=ref(db,"presence/"+uid);
const disconnectMsgRef = push(messagesRef);


try{

await set(uref,{
name:activeName,
avatar:activeAvatar,
color:activeColor,
createdAt:Date.now()
});

// Sayfa yenilendiğinde (F5) onDisconnect tetiklenmesin diye yakalıyoruz
window.addEventListener("beforeunload", () => {
  uref.onDisconnect().cancel();
  disconnectMsgRef.onDisconnect().cancel();
});

// Tarayıcı / sekme tamamen kapatıldığında çalışır
onDisconnect(uref).remove();
onDisconnect(disconnectMsgRef).set({
name: "Sistem",
text: activeName + " sohbetten ayrıldı.",
type: "system",
createdAt: Date.now()
});

// Sadece oturum açıldığında (ilk giriş veya sekme kapandıktan sonra ilk açılış) giriş mesajı yazar
if(!sessionStorage.getItem("kralfm_joined_logged")){
  sessionStorage.setItem("kralfm_joined_logged", "true");
  await push(messagesRef,{
    name: "Sistem",
    text: activeName + " sohbete giriş yaptı.",
    type: "system",
    createdAt: Date.now()
  });
}

}catch(e){

console.error("Presence hata:",e);

}

}


registerPresence();


$("name").addEventListener(
"input",
registerPresence
);

$("userAvatar").addEventListener(
"change",
registerPresence
);

$("userColor").addEventListener(
"change",
registerPresence
);


onValue(presenceRef,snap=>{

const users=snap.val()||{};

const arr=Object.values(users);

$("onlineUsersList").innerHTML="";


staticBots.forEach(bot=>{

const d=document.createElement("div");

d.className="user-list-item";

d.textContent=
bot.avatar+" "+bot.name;

$("onlineUsersList")
.appendChild(d);

});


arr.forEach(u=>{

const d=document.createElement("div");

d.className="user-list-item";

d.textContent=
(u.avatar||"🎧")+" "+u.name;

$("onlineUsersList")
.appendChild(d);

});

});


async function sendMsg(
text,
type="user",
customName=null,
customAvatar=null,
customColor=null
){

const n=
customName||
($("name").value.trim()||defaultGuestName);

const av=
customAvatar||$("userAvatar").value;

const col=
customColor||$("userColor").value;


await registerPresence();


await push(messagesRef,{
name:n,
text,
color:col,
avatar:av,
type,
createdAt:Date.now()
});


const reply=botReply(text,n);


if(reply){

setTimeout(()=>{

push(messagesRef,{
name:"Kral Bot",
text:reply,
type:"bot",
createdAt:Date.now()
});

},500);

}

}


$("form").onsubmit=async e=>{

e.preventDefault();

const t=$("text").value.trim();

if(!t)return;


try{

await sendMsg(t);

$("statusText").textContent=
"Sohbet odası hazır. 🤖";

$("text").value="";

}catch(err){

$("statusText").textContent=
"Mesaj gönderilemedi.";

}

};


$("sendApplause").onclick=()=>sendMsg(
"👏 Coşkulu bir alkış gönderdi!",
"applause"
);


$("sendCoffee").onclick=()=>sendMsg(
"☕ Herkese sıcacık kahve ikram etti!"
);


$("sendHeart").onclick=()=>sendMsg(
"❤️ Kucak dolusu sevgiler gönderdi!"
);


$("sendFire").onclick=()=>sendMsg(
"🔥 Ortamı alevlendirdi!",
"action"
);


$("clearChat").onclick=async()=>{

if(confirm(
"Sohbet odasındaki tüm mesajlar herkes için silinecek. Emin misiniz?"
)){

await set(messagesRef,null);

$("statusText").textContent=
"Ekran herkeste temizlendi.";

}

};


$("openRequestModal").onclick=()=>{

$("requestModal").style.display="flex";

};


$("closeRequestModal").onclick=()=>{

$("requestModal").style.display="none";

};


$("sendRequest").onclick=async()=>{

const a=$("songArtist").value.trim();

const t=$("songTitle").value.trim();


if(!a||!t){

alert(
"Lütfen sanatçı ve şarkı adını yazın."
);

return;

}


try{

await sendMsg(
'🎵 İSTEK PARÇA: '+a+' - "'+t+'"',
"request"
);

$("songArtist").value="";

$("songTitle").value="";

$("requestModal").style.display="none";

$("statusText").textContent=
"Sohbet odası hazır. 🤖";

}catch(err){

$("statusText").textContent=
"Mesaj gönderilemedi.";

}

};

</script>
