<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kral FM Muhabbet</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
header{padding:22px 16px;text-align:center;background:linear-gradient(135deg,#111,#2a2a2a)}
h1{margin:0 0 6px;font-size:28px}.sub{color:#bbb}
.wrap{max-width:720px;margin:20px auto;padding:0 14px}
.card{background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:16px;box-shadow:0 8px 30px #0006}
#messages{height:55vh;min-height:360px;overflow:auto;padding:8px}
.msg{padding:10px 12px;margin:8px 0;background:#262626;border-radius:12px}
.name{font-weight:bold}.time{font-size:11px;color:#888;margin-left:8px}
.form{display:flex;gap:8px;margin-top:12px}.form input{flex:1;padding:13px;border-radius:12px;border:1px solid #444;background:#101010;color:#fff}
button{border:0;border-radius:12px;padding:12px 16px;background:#e11;color:#fff;font-weight:bold;cursor:pointer}
.note{text-align:center;color:#999;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<header><h1>👑 Kral FM Muhabbet</h1><div class="sub">Radyo • Sohbet • Muhabbet</div></header>
<div class="wrap"><div class="card">
<div id="messages">
<div class="msg"><span class="name">Sistem</span><span class="time">şimdi</span><br>Hoş geldiniz! Gerçek zamanlı sohbet bağlantısı hazırlandığında mesajlar tüm kullanıcılara anında ulaşacak.</div>
</div>
<div class="form">
<input id="name" maxlength="20" placeholder="Adınız">
<input id="text" maxlength="300" placeholder="Mesajınız">
<button onclick="send()">Gönder</button>
</div>
<div class="note">Kral FM Muhabbet</div>
</div></div>
<script>
function send(){
 const n=document.getElementById('name').value.trim()||'Misafir';
 const t=document.getElementById('text').value.trim();
 if(!t)return;
 const d=document.createElement('div'); d.className='msg';
 const now=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
 d.innerHTML='<span class="name">'+escapeHtml(n)+'</span><span class="time">'+now+'</span><br>'+escapeHtml(t);
 document.getElementById('messages').appendChild(d);
 document.getElementById('messages').scrollTop=999999;
 document.getElementById('text').value='';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
</script>
</body>
</html>
