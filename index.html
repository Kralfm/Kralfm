<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kral FM Muhabbet</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}header{background:#b00000;padding:18px;text-align:center;font-size:24px;font-weight:bold}main{max-width:760px;margin:auto;padding:15px}.card{background:#1e1e1e;border-radius:14px;padding:15px;margin-bottom:15px}#messages{height:52vh;overflow:auto;background:#0b0b0b;border-radius:10px;padding:10px}.msg{background:#292929;border-radius:9px;padding:9px;margin:7px 0;word-break:break-word}.name{font-weight:bold;color:#ff5555;margin-right:6px}form{display:flex;gap:7px;margin-top:10px}input{flex:1;min-width:0;padding:12px;border:0;border-radius:8px;font-size:16px}button,.listen{border:0;border-radius:8px;padding:12px 15px;background:#e00000;color:#fff;font-weight:bold;text-decoration:none}#clear{margin-top:12px}.note{color:#aaa;font-size:13px}</style></head><body><header>🎙️ Kral FM Muhabbet</header><main><div class="card"><h2>📻 Kral FM</h2><a class="listen" href="http://kralfm.radiostream321.com/" target="_blank" rel="noopener">▶ Kral FM'i Dinle</a></div><div class="card"><h2>💬 Canlı Muhabbet</h2><div id="messages"></div><form id="chatForm"><input id="name" maxlength="30" placeholder="Adınız" required><input id="text" maxlength="300" placeholder="Mesajınız" required><button>Gönder</button></form><button id="clear" type="button">🗑️ Sohbeti Temizle</button><p id="status" class="note">Bağlanıyor...</p></div></main><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, remove, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDvfuuPnoBVhBNyMg1n0iBfsY9J29IwbzA",authDomain:"kralfm-muhabbet.firebaseapp.com",databaseURL:"https://kralfm-muhabbet-default-rtdb.europe-west1.firebasedatabase.app",projectId:"kralfm-muhabbet",storageBucket:"kralfm-muhabbet.firebasestorage.app",messagingSenderId:"638769846511",appId:"1:638769846511:web:f6d8abb91564873996a"};
const db=getDatabase(initializeApp(firebaseConfig)),messagesRef=ref(db,"messages"),box=document.getElementById("messages"),status=document.getElementById("status");
onChildAdded(query(messagesRef,orderByChild("createdAt"),limitToLast(100)),s=>{const d=s.val()||{},r=document.createElement("div"),n=document.createElement("span"),t=document.createElement("span");r.className="msg";n.className="name";n.textContent=(d.name||"Misafir")+":";t.textContent=d.text||"";r.append(n,t);box.appendChild(r);box.scrollTop=box.scrollHeight});status.textContent="Sohbet hazır.";
document.getElementById("chatForm").addEventListener("submit",async e=>{e.preventDefault();const n=document.getElementById("name").value.trim(),t=document.getElementById("text").value.trim();if(!n||!t)return;try{await push(messagesRef,{name:n.slice(0,30),text:t.slice(0,300),createdAt:Date.now()});document.getElementById("text").value=""}catch(e){status.textContent="Mesaj gönderilemedi."}});
document.getElementById("clear").addEventListener("click",async()=>{if(!confirm("Tüm sohbet mesajları silinsin mi?"))return;try{await remove(messagesRef);box.innerHTML="";status.textContent="Sohbet temizlendi."}catch(e){status.textContent="Sohbet silinemedi."}});
</script></body></html><button onclick="window.open('http://kralfm.radiostream321.com/', '_blank')">
