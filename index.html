<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue,
set,
onDisconnect
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig={

apiKey:"AIzaSyDvfuuPnoBVhBNyMg1n0iBfsY9J29IwbzA",
authDomain:"kralfm-muhabbet.firebaseapp.com",
databaseURL:"https://kralfm-muhabbet-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"kralfm-muhabbet",
storageBucket:"kralfm-muhabbet.firebasestorage.app",
messagingSenderId:"638769846511",
appId:"1:638769846511:web:f6d8abb91564873996"

};


const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const messagesRef=ref(db,"messages");
const presenceRef=ref(db,"presence");

const $=id=>document.getElementById(id);

let sound=true;

const uid=
"user_"+Math.random().toString(36).slice(2,10);

const notification=$("notificationSound");
const applause=$("applauseSound");

const defaultGuestName=
"Misafir_"+Math.floor(Math.random()*900+100);


const staticBots=[

{name:"DuRu",avatar:"👩"},
{name:"Eren",avatar:"👨"},
{name:"LeyLi",avatar:"🌟"},
{name:"RadyoDinliyorum",avatar:"🎧"}

];


/* ==========================================
   SES
========================================== */

$("soundToggle").onclick=()=>{

sound=!sound;

$("soundToggle").textContent=
sound?"🔔 Ses Açık":"🔕 Sessiz";

};


/* ==========================================
   ÇEVRİMİÇİ MENÜ
========================================== */

function openDrawer(){

$("userDrawer").classList.add("open");
$("drawerOverlay").style.display="block";

}

function closeDrawer(){

$("userDrawer").classList.remove("open");
$("drawerOverlay").style.display="none";

}

$("menuTrigger").onclick=openDrawer;
$("closeDrawer").onclick=closeDrawer;
$("drawerOverlay").onclick=closeDrawer;


/* ==========================================
   SAAT
========================================== */

function time(t){

return new Date(t||Date.now())
.toLocaleTimeString("tr-TR",{
hour:"2-digit",
minute:"2-digit"
});

}


/* ==========================================
   MESAJ GÖSTER
========================================== */

function appendMessage(d){

const box=$("messages");

if(!box||!d)return;

const r=document.createElement("div");

const ts=document.createElement("span");

ts.className="time";

ts.textContent=
"["+time(d.createdAt)+"] ";


/* SİSTEM MESAJI */

if(d.type==="system"){

r.className="msg system-msg";

r.textContent=
ts.textContent+" "+d.text;

box.appendChild(r);

box.scrollTop=box.scrollHeight;

return;

}


const av=document.createElement("span");
const n=document.createElement("span");
const t=document.createElement("span");

av.className="avatar";

av.textContent=
(d.type==="bot"?"🤖":(d.avatar||"🎧"))+" ";


n.className=
d.type==="bot"?"name bot-name":"name";

n.textContent=
(d.name||"Misafir")+": ";


t.textContent=d.text||"";


if(d.type==="applause")

r.className="msg applause-msg";

else if(d.type==="request")

r.className="msg request-msg";

else if(d.type==="whisper")

r.className="msg whisper-msg";

else if(d.type==="action")

r.className="msg action-msg";

else

r.className=
d.type==="bot"?"msg bot-msg":"msg";


if(d.type==="bot"){

const b=document.createElement("span");

b.className="bot-badge";

b.textContent="BOT";

r.append(ts,b,av,n,t);

}else{

r.append(ts,av,n,t);

}


if(d.type!=="bot"&&d.color)

n.style.color=d.color;


box.appendChild(r);

box.scrollTop=box.scrollHeight;


/* SES */

if(sound){

const snd=
d.type==="applause"
?applause
:notification;

snd.currentTime=0;

snd.play().catch(()=>{});

}

}


/* ==========================================
   MESAJLARI FIREBASE'DEN OKU
========================================== */

onValue(messagesRef,snap=>{

const data=snap.val()||{};

$("messages").innerHTML="";

Object.values(data).forEach(d=>{

appendMessage(d);

});

});


/* ==========================================
   BOT
========================================== */

function botReply(text,user){

const m=text.toLowerCase();

if(user.toLowerCase()==="kral bot")
return null;

if(m.includes("selam"))

return "Aleykümselam @"+user+" 👋";

if(m.includes("merhaba"))

return "Merhaba @"+user+
"! Kral FM'e hoş geldin. 📻";

if(m.includes("kahve"))

return "☕ Sayın @"+user+
", kahveniz hazır! Afiyet olsun.";

if(m.includes("istek"))

return "🎵 İstek mesajınız yayıncıya iletildi. Keyifli dinlemeler!";

return null;

}


/* ==========================================
   PRESENCE
========================================== */

let previousUsers={};
let presenceLoaded=false;


async function registerPresence(){

const activeName=
$("name").value.trim()||defaultGuestName;

const activeAvatar=
$("userAvatar").value;

const activeColor=
$("userColor").value;

const uref=
ref(db,"presence/"+uid);


try{

await set(uref,{

name:activeName,
avatar:activeAvatar,
color:activeColor,
createdAt:Date.now()

});


onDisconnect(uref).remove();

}catch(e){

console.error("Presence hata:",e);

}

}


/* İlk kayıt */

registerPresence();


/* Kullanıcı bilgisi değişirse güncelle */

$("name").addEventListener(
"input",
registerPresence
);

$("userAvatar").addEventListener(
"change",
registerPresence
);

$("userColor").addEventListener(
"change",
registerPresence
);


/* ==========================================
   GİRİŞ / ÇIKIŞ MESAJI
========================================== */

function localSystemMessage(text){

const box=$("messages");

if(!box)return;

const r=document.createElement("div");

r.className="msg system-msg";

r.textContent=
"["+time()+"] "+text;

box.appendChild(r);

box.scrollTop=box.scrollHeight;

}


/* ==========================================
   ÇEVRİMİÇİ KULLANICILARI OKU
========================================== */

onValue(presenceRef,snap=>{

const users=snap.val()||{};


/*
ÖNCE çevrim içi listesini temizle
*/

const list=$("onlineUsersList");

if(list){

list.innerHTML="";


/* Botlar */

staticBots.forEach(bot=>{

const d=document.createElement("div");

d.className="user-list-item";

d.textContent=
bot.avatar+" "+bot.name;

list.appendChild(d);

});


/* Gerçek kullanıcılar */

Object.entries(users).forEach(([id,u])=>{

if(!u)return;

const d=document.createElement("div");

d.className="user-list-item";

d.textContent=
"🟢 "+(u.avatar||"🎧")+" "+(u.name||"Misafir");

list.appendChild(d);

});


if(
Object.keys(users).length===0 &&
staticBots.length===0
){

list.textContent="Kimse yok...";

}

}


/* ==========================================
   GİRİŞ / ÇIKIŞ KONTROLÜ
========================================== */

if(presenceLoaded){

/* YENİ GELEN */

Object.keys(users).forEach(id=>{

if(
!previousUsers[id] &&
id!==uid
){

const u=users[id];

localSystemMessage(
"🟢 "+(u.name||"Misafir")+
" sohbete katıldı."
);

}

});


/* AYRILAN */

Object.keys(previousUsers).forEach(id=>{

if(
!users[id] &&
id!==uid
){

const u=previousUsers[id];

localSystemMessage(
"🔴 "+(u.name||"Misafir")+
" sohbetten ayrıldı."
);

}

});

}


previousUsers=users;
presenceLoaded=true;

});


/* ==========================================
   TAB İLE İSİM TAMAMLAMA
========================================== */

$("text").addEventListener(
"keydown",
function(e){

if(e.key!=="Tab")return;

e.preventDefault();

const yazilan=
this.value.trim();

if(!yazilan)return;


/* Kullanıcı isimleri */

const isimler=[];


/* Çevrim içindeki gerçek kişiler */

Object.values(previousUsers).forEach(u=>{

if(u&&u.name){

isimler.push(u.name);

}

});


/* Botlar */

staticBots.forEach(bot=>{

isimler.push(bot.name);

});


/* Türkçe karakter uyumlu arama */

const aranan=
yazilan.toLocaleLowerCase("tr-TR");


const bulunan=
isimler.find(isim=>

isim
.toLocaleLowerCase("tr-TR")
.startsWith(aranan)

);


if(bulunan){

this.value=
bulunan+" ";

this.focus();

}

});


/* ==========================================
   MESAJ GÖNDER
========================================== */

async function sendMsg(

text,
type="user",
customName=null,
customAvatar=null,
customColor=null

){

const n=
customName||
($("name").value.trim()||defaultGuestName);

const av=
customAvatar||
$("userAvatar").value;

const col=
customColor||
$("userColor").value;


await registerPresence();


await push(messagesRef,{

name:n,
text:text,
color:col,
avatar:av,
type:type,
createdAt:Date.now()

});


/* BOT CEVABI */

const reply=
botReply(text,n);


if(reply){

setTimeout(()=>{

push(messagesRef,{

name:"Kral Bot",
text:reply,
type:"bot",
createdAt:Date.now()

});

},500);

}

}


/* ==========================================
   NORMAL MESAJ
========================================== */

$("form").onsubmit=async e=>{

e.preventDefault();

const t=
$("text").value.trim();

if(!t)return;

try{

await sendMsg(t);

$("text").value="";

$("statusText").textContent=
"Sohbet odası hazır. 🤖";

}catch(err){

console.error(err);

$("statusText").textContent=
"Mesaj gönderilemedi.";

}

};

   ALKIŞ

/* ==========================================
   HERKESTE TEMİZLE
========================================== */

$("clearChat").onclick=async()=>{

if(confirm(
"Sohbet odasındaki tüm mesajlar herkes için silinecek. Emin misiniz?"
)){

await set(messagesRef,null);

$("statusText").textContent=
"Ekran herkeste temizlendi.";

}

};


/* ==========================================
   İSTEK PARÇA
========================================== */

$("openRequestModal").onclick=()=>{

$("requestModal").style.display="flex";

};


$("closeRequestModal").onclick=()=>{

$("requestModal").style.display="none";

};


$("sendRequest").onclick=async()=>{

const a=
$("songArtist").value.trim();

const t=
$("songTitle").value.trim();


if(!a||!t){

alert(
"Lütfen sanatçı ve şarkı adını yazın."
);

return;

}


try{

await sendMsg(

'🎵 İSTEK PARÇA: '+
a+' - "'+t+'"',

"request"

);


$("songArtist").value="";
$("songTitle").value="";

$("requestModal").style.display="none";

}catch(err){

console.error(err);

}

};


/* ==========================================
   HER SAAT BAŞI KRAL BOT
========================================== */

function checkHourlyBot(){

const now=new Date();

const dakika=
now.getMinutes();

const saniye=
now.getSeconds();


/*
Sadece saat 00-05 saniyeleri arasında çalışır.
*/

if(
dakika!==0 ||
saniye>5
){

return;

}


const key=
now.getFullYear()+"-"+
now.getMonth()+"-"+
now.getDate()+"-"+
now.getHours();


const last=
localStorage.getItem(
"kralfm_hourly_bot"
);


if(last===key)return;


localStorage.setItem(
"kralfm_hourly_bot",
key
);


push(messagesRef,{

name:"Kral Bot",

text:
"🕐 Saat "+time(now)+
" oldu. Kral FM'de keyifli dinlemeler! 📻🎶",

type:"bot",

createdAt:Date.now()

});

}


setInterval(
checkHourlyBot,
1000
);

   </script>
