<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kral FM Muhabbet</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
header{background:#b00000;text-align:center;padding:18px;font-size:25px;font-weight:bold}
main{max-width:760px;margin:auto;padding:14px}
section{background:#1d1d1d;border-radius:14px;padding:15px;margin-bottom:14px}
a.listen{display:block;text-align:center;background:#e00000;color:white;text-decoration:none;padding:14px;border-radius:10px;font-weight:bold}
#messages{height:52vh;overflow:auto;background:#101010;border-radius:10px;padding:10px}
.msg{background:#292929;border-radius:9px;padding:9px;margin:6px 0;word-break:break-word}
.name{font-weight:bold;color:#ff5555;margin-right:6px}
form{display:flex;gap:7px;margin-top:10px}
input{min-width:0;flex:1;padding:13px;border:0;border-radius:9px;font-size:16px}
button{padding:13px 16px;border:0;border-radius:9px;background:#e00000;color:white;font-weight:bold}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>
<header>🎙️ Kral FM Muhabbet</header>
<main>
<section>
<h2>📻 Kral FM</h2>
<a class="listen" href="http://kralfm.radiostream321.com/" target="_blank" rel="noopener">▶ Kral FM'i Dinle</a>
<p class="small">Yayın açıldığında dinlemek için butona dokun.</p>
</section>
<section>
<h2>💬 Canlı Muhabbet</h2>
<div id="messages"></div>
<form id="chatForm">
<input id="name" maxlength="30" placeholder="Adınız" required>
<input id="text" maxlength="300" placeholder="Mesajınız" required>
<button>Gönder</button>
</form>
<p id="status" class="small">Bağlanıyor...</p>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getDatabase,ref,push,onChildAdded,query,orderByChild,limitToLast}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyDvfuuPnoBVhBNgMy1n0iBfsY9J29IwbzA",
 authDomain:"kralfm-muhabbet.firebaseapp.com",
 databaseURL:"https://kralfm-muhabbet-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"kralfm-muhabbet",
 storageBucket:"kralfm-muhabbet.firebasestorage.app",
 messagingSenderId:"638769846511",
 appId:"1:638769846511:web:f6d8abb91564873996a31a"
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const messagesQuery=query(ref(db,"messages"),orderByChild("createdAt"),limitToLast(100));
const box=document.getElementById("messages");
const status=document.getElementById("status");

onChildAdded(messagesQuery,s=>{
 const d=s.val()||{};
 const el=document.createElement("div"); el.className="msg";
 const n=document.createElement("span"); n.className="name"; n.textContent=(d.name||"Misafir")+":";
 const t=document.createElement("span"); t.textContent=d.text||"";
 el.append(n,t); box.appendChild(el); box.scrollTop=box.scrollHeight;
});
status.textContent="Sohbet bağlantısı hazır.";

document.getElementById("chatForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const name=document.getElementById("name").value.trim().slice(0,30);
 const text=document.getElementById("text").value.trim().slice(0,300);
 if(!name||!text)return;
 try{
  await push(ref(db,"messages"),{name,text,createdAt:Date.now()});
  document.getElementById("text").value="";
 }catch(err){
  status.textContent="Mesaj gönderilemedi. Firebase Kuralları yazma iznini engelliyor olabilir.";
 }
});
</script>
</body>
</html>
