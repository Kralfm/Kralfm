<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Radyo Kral FM Muhabbet</title>
<style>
/* CSS'de sadece emoji panelini daha görünür kılacak güncellemeler yapıldı */

body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
header{background:#b00000;padding:18px;text-align:center;font-size:22px;font-weight:bold;box-shadow: 0 2px 10px rgba(255, 0, 0, 0.3)}
main{max-width:850px;margin:auto;padding:15px}
.card{background:#1e1e1e;border-radius:14px;padding:18px;margin-bottom:15px}

/* --- MOBİL UYUMLU SOHBET ALANI --- */
#messages {
  height: 50dvh;
  min-height: 280px;
  max-height: 500px;
  overflow-y: auto;
  background: #0b0b0b;
  border-radius: 10px;
  padding: 12px;
  border: 1px solid #333;
}

.msg {
  background: #292929;
  border-radius: 9px;
  padding: 10px 12px;
  margin: 8px 0;
  cursor: pointer;
}

.msg.mentioned-msg {
  background: #4a3d00 !important;
  border: 1px solid #f59e0b !important;
}

/* --- GÜNCELLENMİŞ EMOJİ BUTONU VE PANELİ (DAHA BELİRGİN) --- */
.input-container {
  flex: 1;
  display: flex;
  position: relative;
  min-width: 200px;
}

input#text {
  width: 100%;
  padding: 14px 50px 14px 15px; /* Butona yer açmak için sağ padding arttırıldı */
  border: 1px solid #444;
  background: #2a2a2a;
  color: #fff;
  border-radius: 8px;
  font-size: 16px;
}

.emoji-btn {
  position: absolute;
  right: 5px;
  top: 50%;
  transform: translateY(-50%);
  background: #333;
  border: 1px solid #555;
  border-radius: 50%;
  width: 38px;
  height: 38px;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.emoji-picker {
  display: none;
  position: absolute;
  bottom: 65px; /* Biraz yukarı kaldırıldı */
  right: 0;
  width: 100%;
  background: #222;
  border: 2px solid #444;
  border-radius: 15px;
  padding: 15px;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  z-index: 9999; /* En üst katmanda olması sağlandı */
}

.emoji-picker.active { display: grid; }

.emoji-picker span {
  font-size: 28px; /* Emojiler büyütüldü */
  cursor: pointer;
  text-align: center;
  padding: 8px;
  background: #333;
  border-radius: 8px;
}

/* Diğer sabit stiller aşağıda aynıdır */
button[type="submit"] { border: 0; border-radius: 8px; padding: 14px 20px; background: #e00000; color: #fff; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<header>🎙️ Kral FM Muhabbet</header>

<main>
<div class="card">
  <div id="messages"></div>

  <form id="chatForm">
    <!-- Diğer form elemanları -->
    <input type="text" id="name" maxlength="30" placeholder="Adınız" style="padding:12px; border-radius:8px; border:0; background:#2a2a2a; color:#fff;">
    
    <div class="input-container">
      <input type="text" id="text" maxlength="300" placeholder="Mesajınız..." required>
      <button type="button" class="emoji-btn" id="emojiToggle">😀</button>
      <div class="emoji-picker" id="emojiPicker">
        <span>😀</span><span>😂</span><span>😍</span><span>🔥</span><span>☕</span><span>❤️</span>
        <span>🎧</span><span>🎶</span><span>📻</span><span>🎙️</span><span>👏</span><span>💃</span>
      </div>
    </div>

    <button type="submit">Gönder</button>
  </form>
</div>
</main>

<script>
// JavaScript kısmı (Toggle mantığı)
const emojiToggle = document.getElementById("emojiToggle");
const emojiPicker = document.getElementById("emojiPicker");
const textInput = document.getElementById("text");

emojiToggle.addEventListener("click", (e) => {
  e.preventDefault(); // Sayfanın yenilenmesini engeller
  e.stopPropagation();
  emojiPicker.classList.toggle("active");
});

// Panel dışına tıklayınca kapanması için
document.addEventListener("click", (e) => {
  if (!emojiPicker.contains(e.target) && e.target !== emojiToggle) {
    emojiPicker.classList.remove("active");
  }
});

// Emoji seçince metne ekle
emojiPicker.querySelectorAll("span").forEach(emoji => {
  emoji.addEventListener("click", () => {
    textInput.value += emoji.textContent;
    textInput.focus();
  });
});
</script>

</body>
</html>
