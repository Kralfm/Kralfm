<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radyo Kral FM & Muhabbet</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
header{background:#b00000;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:bold}
.room-tabs{display:flex;background:#1a1a1a;border-bottom:2px solid #333}
.room-tab{flex:1;padding:12px;text-align:center;background:#1e1e1e;color:#aaa;cursor:pointer;font-weight:bold}
.room-tab.active{background:#b00000;color:#fff}
main{max-width:850px;margin:auto;padding:15px}
.room-content{display:none}
.room-content.active{display:block}
.card{background:#1e1e1e;border-radius:14px;padding:18px;margin-bottom:15px}
.play-btn{width:100%;padding:14px;font-size:17px;background:#e00000;border:0;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer}
#messages{height:350px;overflow-y:auto;background:#0b0b0b;border-radius:10px;padding:12px;border:1px solid #333}
.msg{background:#292929;border-radius:9px;padding:10px;margin:8px 0;font-size:15px}
form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input,select{background:#2a2a2a;color:#fff;border-radius:8px;border:0;padding:12px}
button[type="submit"]{border:0;border-radius:8px;padding:12px 20px;background:#e00000;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<header>
  <div>🎙️ Kral FM & Muhabbet</div>
</header>

<div class="room-tabs">
  <div class="room-tab active" data-target="radioRoom">📻 Radyo Odası</div>
  <div class="room-tab" data-target="chatRoom">💬 Sohbet Odası</div>
</div>

<main>
  <div id="radioRoom" class="room-content active">
    <div class="card" style="text-align:center;">
      <h2>📻 Radyo Kral FM Canlı Yayın</h2>
      <p style="color:#aaa;">Müziğin ritmini yakalamak için aşağıdaki butona tıklayın:</p>
      
      <button type="button" class="play-btn" id="toggleRadio">
        ▶️ Radyoyu Dinle
      </button>

      <audio id="liveRadioStream" preload="none">
        <source src="https://icecast.vrtcdn.be/radio1-high.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <div id="chatRoom" class="room-content">
    <div class="card">
      <h2>💬 Canlı Sohbet</h2>
      <div id="messages"></div>
      <form id="chatForm">
        <input type="text" id="name" placeholder="Adınız" required style="width:120px;">
        <input type="text" id="text" placeholder="Mesajınızı yazın..." required style="flex:1;">
        <button type="submit">Gönder</button>
      </form>
    </div>
  </div>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDvfuuPnoBVhBNyMg1n0iBfsY9J29IwbzA",
  authDomain: "kralfm-muhabbet.firebaseapp.com",
  databaseURL: "https://kralfm-muhabbet-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kralfm-muhabbet",
  storageBucket: "kralfm-muhabbet.firebasestorage.app",
  messagingSenderId: "638769846511",
  appId: "1:638769846511:web:f6d8abb91564873996"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const messagesRef = db.ref("messages");

// Sekme Değişimi
document.querySelectorAll(".room-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".room-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".room-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.target).classList.add("active");
  });
});

// Radyo Oynat / Durdur
const toggleRadioBtn = document.getElementById("toggleRadio");
const liveRadioStream = document.getElementById("liveRadioStream");

toggleRadioBtn.addEventListener("click", () => {
  if (liveRadioStream.paused) {
    liveRadioStream.play().then(() => {
      toggleRadioBtn.textContent = "⏸️ Radyoyu Durdur";
      toggleRadioBtn.style.background = "#008000";
    }).catch(e => {
      alert("Tarayıcı engeli nedeniyle ses oynatılamadı. Lütfen tekrar dokunun.");
    });
  } else {
    liveRadioStream.pause();
    toggleRadioBtn.textContent = "▶️ Radyoyu Dinle";
    toggleRadioBtn.style.background = "#e00000";
  }
});

// Sohbet Sistemi
const box = document.getElementById("messages");
messagesRef.on("child_added", s => {
  const d = s.val();
  if(!d) return;
  const r = document.createElement("div");
  r.className = "msg";
  r.innerHTML = `<b>${d.name}:</b> ${d.text}`;
  box.appendChild(r);
  box.scrollTop = box.scrollHeight;
});

document.getElementById("chatForm").addEventListener("submit", e => {
  e.preventDefault();
  const n = document.getElementById("name").value.trim();
  const t = document.getElementById("text").value.trim();
  if(!n || !t) return;
  messagesRef.push({ name: n, text: t, createdAt: Date.now() });
  document.getElementById("text").value = "";
});
</script>

</body>
</html>
