<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  onDisconnect,
  set,
  remove,
  onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDvfuuPnoBVhBNyMg1n0iBfsY9J29IwbzA",
  authDomain: "kralfm-muhabbet.firebaseapp.com",
  databaseURL: "https://kralfm-muhabbet-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kralfm-muhabbet",
  storageBucket: "kralfm-muhabbet.firebasestorage.app",
  messagingSenderId: "638769846511",
  appId: "1:638769846511:web:f6d8abb91564873996"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messagesRef = ref(db, "messages");
const presenceRef = ref(db, "presence");

const tabs = document.querySelectorAll(".room-tab");
const contents = document.querySelectorAll(".room-content");

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    contents.forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.target).classList.add("active");
  });
});

const menuTrigger = document.getElementById("menuTrigger");
const userDrawer = document.getElementById("userDrawer");
const drawerOverlay = document.getElementById("drawerOverlay");
const closeDrawer = document.getElementById("closeDrawer");

function toggleDrawer() {
  userDrawer.classList.toggle("open");
  drawerOverlay.style.display = userDrawer.classList.contains("open") ? "block" : "none";
}

menuTrigger.addEventListener("click", toggleDrawer);
closeDrawer.addEventListener("click", toggleDrawer);
drawerOverlay.addEventListener("click", toggleDrawer);

let touchStartX = 0;
document.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener("touchend", e => {
  let touchEndX = e.changedTouches[0].screenX;
  if (touchEndX < touchStartX - 80 && touchStartX > window.innerWidth - 60) {
    userDrawer.classList.add("open");
    drawerOverlay.style.display = "block";
  }
  if (touchEndX > touchStartX + 80 && userDrawer.classList.contains("open")) {
    userDrawer.classList.remove("open");
    drawerOverlay.style.display = "none";
  }
});

const box = document.getElementById("messages");
const status = document.getElementById("status");
const nameInput = document.getElementById("name");
const textInput = document.getElementById("text");
const colorInput = document.getElementById("userColor");
const avatarInput = document.getElementById("userAvatar");
const toggleRadioBtn = document.getElementById("toggleRadio");
const onlineUsersList = document.getElementById("onlineUsersList");
const radioRoomUsers = document.getElementById("radioRoomUsers");

const applauseAudio = document.getElementById("applauseSound");
const notifyAudio = document.getElementById("notificationSound");
const soundToggleBtn = document.getElementById("soundToggle");

let isSoundEnabled = true;
let myUserId = 'user_' + Math.random().toString(36).substring(2, 9);
let currentRegisteredNick = "";

soundToggleBtn.addEventListener("click", () => {
  isSoundEnabled = !isSoundEnabled;
  soundToggleBtn.textContent = isSoundEnabled ? "🔔 Ses Açık" : "🔕 Sessiz";
});

toggleRadioBtn.addEventListener("click", () => {
  window.open("http://kralfm.radio12345.com/", "_blank");
});

function getTimeString(timestamp) {
  return new Date(timestamp || Date.now()).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
}

function showMessage(d) {
  if (!d) return;
  const currentMyName = nameInput.value.trim().toLowerCase();
  
  if (d.type === "whisper") {
    const isSender = d.name.toLowerCase() === currentMyName;
    const isReceiver = d.target && d.target.toLowerCase() === currentMyName;
    if (!isSender && !isReceiver) return;
  }

  const r = document.createElement("div");
  const timeSpan = document.createElement("span");
  const isBot = d.type === "bot";
  
  timeSpan.className = "time";
  timeSpan.textContent = `[${getTimeString(d.createdAt)}] `;

  if (d.type === "system") {
    r.className = "msg system-msg";
    r.textContent = `${timeSpan.textContent} ${d.text}`;
    box.appendChild(r);
    box.scrollTop = box.scrollHeight;
    return;
  }

  const avatarSpan = document.createElement("span");
  avatarSpan.className = "avatar";
  avatarSpan.textContent = isBot ? "🤖 " : `${d.avatar || "🎧"} `;

  const n = document.createElement("span");
  const t = document.createElement("span");

  if (d.type === "whisper") {
    r.className = "msg whisper-msg";
    if(isSoundEnabled) { notifyAudio.currentTime = 0; notifyAudio.play().catch(()=>{}); }
  } else if (d.type === "action") {
    r.className = "msg action-msg";
    if(isSoundEnabled) { notifyAudio.currentTime = 0; notifyAudio.play().catch(()=>{}); }
  } else if (d.type === "applause") {
    r.className = "msg applause-msg";
    if(isSoundEnabled) { applauseAudio.currentTime = 0; applauseAudio.play().catch(()=>{}); }
  } else if (d.type === "request") {
    r.className = "msg request-msg";
    if(isSoundEnabled) { notifyAudio.currentTime = 0; notifyAudio.play().catch(()=>{}); }
  } else {
    r.className = isBot ? "msg bot-msg" : "msg";
    if(isSoundEnabled && !isBot) { notifyAudio.currentTime = 0; notifyAudio.play().catch(()=>{}); }
  }

  n.className = isBot ? "name bot-name" : "name";
  if(!isBot && d.color) n.style.color = d.color;

  if (d.type === "action") {
    n.textContent = `* ${d.name} `;
    t.textContent = d.text;
  } else {
    n.textContent = (d.name || "Misafir") + ": ";
    t.textContent = d.text || "";
    
    if (!isBot) {
      n.title = "Bu kişiye özel mesaj (fısıltı) gönder";
      n.addEventListener("click", () => {
        const whisperedUser = d.name;
        const pmText = prompt(`${whisperedUser} adlı kullanıcıya özel mesajınızı yazın (Fısıltı):`);
        if (pmText && pmText.trim() !== "") {
          sendWhisperMessage(whisperedUser, pmText.trim());
        }
      });
    }
  }

  if (isBot) {
    const badge = document.createElement("span");
    badge.className = "bot-badge";
    badge.textContent = "BOT";
    r.append(timeSpan, badge, avatarSpan, n, t);
  } else if (d.type === "whisper") {
    const badge = document.createElement("span");
    badge.className = "whisper-badge";
    badge.textContent = `ÖZEL -> ${d.target}`;
    r.append(timeSpan, badge, avatarSpan, n, t);
  } else {
    r.append(timeSpan, avatarSpan, n, t);
  }

  box.appendChild(r);
  box.scrollTop = box.scrollHeight;
}

function getBotReply(text, userName) {
  const m = (text || "").toLowerCase().trim();
  if (userName.toLowerCase() === "kral bot") return null;

  if (m.includes("selam") || m === "sa") return `Aleykümselam @${userName}`;
  if (m.includes("kahve")) return `☕ Sayın @${userName}, bol köpüklü taze kahven hazır! Afiyet olsun! 😋`;
  return null;
}

const userRef = ref(db, `presence/${myUserId}`);
onDisconnect(userRef).remove();

async function updatePresence() {
  const username = nameInput.value.trim();
  if (!username) return;

  if (currentRegisteredNick !== username) {
    currentRegisteredNick = username;
    await set(userRef, { name: username, time: Date.now() });
  }
}

// İsim kutusuna yazıldığı an listeye dahil olmasını sağla
nameInput.addEventListener("input", updatePresence);

onValue(presenceRef, snapshot => {
  const data = snapshot.val();
  onlineUsersList.innerHTML = "";
  radioRoomUsers.innerHTML = "";
  
  if (!data) {
    onlineUsersList.innerHTML = `<div style="color: #777; font-size: 13px;">Kimse yok...</div>`;
    radioRoomUsers.innerHTML = `Odada kimse yok.`;
    return;
  }

  let usersHtml = "";
  let radioCount = 0;

  Object.values(data).forEach(user => {
    radioCount++;
    usersHtml += `
      <div class="user-list-item" data-username="${user.name}">
        🎧 <span>${user.name}</span>
      </div>
    `;
  });

  onlineUsersList.innerHTML = usersHtml;
  radioRoomUsers.innerHTML = `Şu an radyo odasında ve çevrimiçi olan <b>${radioCount}</b> kişi dinliyor. Keyifli sohbetler!`;

  // Çekmecedeki kullanıcılara tıklanınca mesaj alanına @ ekleme
  document.querySelectorAll(".user-list-item").forEach(item => {
    item.addEventListener("click", () => {
      textInput.value = `@${item.dataset.username} `;
      userDrawer.classList.remove("open");
      drawerOverlay.style.display = "none";
      textInput.focus();
    });
  });
});

onChildAdded(messagesRef, s => {
  showMessage(s.val());
});

document.getElementById("chatForm").addEventListener("submit", async e => {
  e.preventDefault();
  let n = nameInput.value.trim();
  const c = colorInput.value;
  const a = avatarInput.value;
  let t = textInput.value.trim();

  if (!n || !t) return;

  await updatePresence();

  // 🛠️ MIRC KOMUTU: /nick YeniIsim
  if (t.toLowerCase().startsWith("/nick ")) {
    const newNick = t.substring(6).trim();
    if (newNick && newNick !== n) {
      const oldNick = n;
      nameInput.value = newNick;
      await updatePresence();
      await push(messagesRef, {
        text: `🔄 ${oldNick} rumuzunu "${newNick}" olarak değiştirdi.`,
        type: "system",
        createdAt: Date.now()
      });
      textInput.value = "";
      return;
    }
  }

  // 🛠️ MIRC KOMUTU: /me eylem
  if (t.toLowerCase().startsWith("/me ")) {
    const actionText = t.substring(4).trim();
    if (actionText) {
      await push(messagesRef, {
        name: n, text: actionText, color: c, avatar: a, type: "action", createdAt: Date.now()
      });
      textInput.value = "";
      return;
    }
  }

  try {
    await push(messagesRef, {
      name: n, text: t, color: c, avatar: a, type: "user", createdAt: Date.now()
    });

    const botReply = getBotReply(t, n);
    if (botReply) {
      setTimeout(async () => {
        await push(messagesRef, { name: "Kral Bot", text: botReply, type: "bot", createdAt: Date.now() });
      }, 500);
    }
  } catch (err) {
    alert("Mesaj gönderilemedi.");
  }
  textInput.value = "";
});

async function sendWhisperMessage(targetUser, messageText) {
  const n = nameInput.value.trim() || "Misafir";
  await updatePresence();

  try {
    await push(messagesRef, {
      name: n,
      text: `🔒 [Özel Mesaj] ${messageText}`,
      target: targetUser,
      color: colorInput.value,
      avatar: avatarInput.value,
      type: "whisper",
      createdAt: Date.now()
    });
  } catch (err) {
    console.error("Fısıltı hatası:", err);
  }
}

async function sendQuickMessage(textMsg, type = "user") {
  const n = nameInput.value.trim() || "Misafir";
  await updatePresence();

  try {
    await push(messagesRef, {
      name: n, text: textMsg, color: colorInput.value, avatar: avatarInput.value, type: type, createdAt: Date.now()
    });
  } catch (err) {
    console.error("Hızlı mesaj hatası:", err);
  }
}

document.getElementById("sendApplause").addEventListener("click", () => sendQuickMessage("👏 Coşkulu bir alkış gönderdi!", "applause"));
document.getElementById("sendCoffee").addEventListener("click", () => sendQuickMessage("☕ Odadaki herkese sıcacık bir kahve ikram etti!"));
document.getElementById("sendHeart").addEventListener("click", () => sendQuickMessage("❤️ Kucak dolusu sevgiler ve kalpler gönderdi!"));
document.getElementById("sendFire").addEventListener("click", () => sendQuickMessage("🔥 Ortamı alev alev yaktı!"));

const requestModal = document.getElementById("requestModal");
document.getElementById("openRequestModal").addEventListener("click", () => requestModal.style.display = "flex");
document.getElementById("closeRequestModal").addEventListener("click", () => requestModal.style.display = "none");

document.getElementById("sendRequest").addEventListener("click", async () => {
  const artist = document.getElementById("songArtist").value.trim();
  const title = document.getElementById("songTitle").value.trim();

  if(!artist || !title) {
    alert("Lütfen hem sanatçı hem de şarkı adını giriniz.");
    return;
  }

  const requestText = `🎵 İSTEK PARÇA: ${artist} - "${title}" şarkısını yayıncımızdan istiyor!`;
  await sendQuickMessage(requestText, "request");

  document.getElementById("songArtist").value = "";
  document.getElementById("songTitle").value = "";
  requestModal.style.display = "none";
});

document.getElementById("clear").addEventListener("click", () => {
  box.innerHTML = "";
});
                              </script>
