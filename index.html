<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kral FM - Web IRC Sohbet</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
--bg-main: #111;
--panel-bg: #1e1e1e;
--accent-red: #b00000;
--irc-header: #2d2d2d;
--text-main: #fff;
--text-muted: #aaa;
}

body { margin: 0; background: var(--bg-main); color: var(--text-main); font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

header { background: var(--accent-red); padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; font-size: 18px; font-weight: bold; box-shadow: 0 2px 10px rgba(255, 0, 0, 0.3); z-index: 10; }

.sound-toggle-btn { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 5px 10px; border-radius: 15px; font-size: 11px; cursor: pointer; }

/* Ana Layout (IRC Tarzı Yan Menü + Sohbet) */
.irc-container { display: flex; flex: 1; overflow: hidden; position: relative; }

/* Sol Sidebar: Kanallar ve Kullanıcılar */
.irc-sidebar { width: 240px; background: #161616; border-right: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease; }
.sidebar-section { padding: 12px; border-bottom: 1px solid #252525; }
.sidebar-section h3 { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px 0; letter-spacing: 1px; }

.channel-list, .user-list { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
.channel-list li, .user-list li { padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
.channel-list li:hover, .user-list li:hover { background: #252525; }
.channel-list li.active { background: var(--accent-red); font-weight: bold; }

/* Sağ Alan: Radyo + Mesajlar */
.irc-main { flex: 1; display: flex; flex-direction: column; background: #0b0b0b; overflow: hidden; }

.radio-mini-bar { background: linear-gradient(90deg, #180303, #2a0808); border-bottom: 1px solid #400; padding: 8px 15px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.radio-info { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: bold; }
.live-dot { width: 8px; height: 8px; background-color: #ff3333; border-radius: 50%; box-shadow: 0 0 8px #ff3333; display: inline-block; }
.mini-play-btn { background: #e00000; border: 0; color: #fff; padding: 5px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }

/* Mesaj Ekranı */
#messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 6px; font-family: monospace; font-size: 14px; }
.msg { word-break: break-word; line-height: 1.4; padding: 2px 4px; }
.msg.system-msg { color: #f1c40f; font-style: italic; }
.msg.action-msg { color: #3498db; font-style: italic; }
.time { color: #666; font-size: 11px; margin-right: 6px; }
.name { font-weight: bold; margin-right: 6px; }

/* Alt Form ve Komut Satırı */
.irc-input-bar { padding: 10px; background: #181818; border-top: 1px solid #333; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.irc-input-bar input { flex: 1; background: #252525; border: 1px solid #444; color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 14px; outline: none; }
.irc-input-bar input:focus { border-color: var(--accent-red); }
.irc-input-bar button { background: var(--accent-red); border: 0; color: #fff; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

/* Mobil Uyumluluk için Çekmece (Drawer) Menü */
.mobile-menu-toggle { display: none; background: transparent; border: 0; color: #fff; font-size: 20px; cursor: pointer; }

@media (max-width: 768px) {
.irc-sidebar { position: absolute; height: 100%; z-index: 100; transform: translateX(-100%); }
.irc-sidebar.open { transform: translateX(0); }
.mobile-menu-toggle { display: block; }
}

/* Modaller */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
.modal-box { background: #1e1e1e; border: 1px solid #555; border-radius: 10px; padding: 20px; width: 90%; max-width: 350px; }
.modal-box h3 { margin-top: 0; color: #ff5555; }
.modal-box input { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
</style>
</head>

<body>

<header>
<div style="display:flex; align-items:center; gap:10px;">
<button class="mobile-menu-toggle" id="menuToggle">☰</button>
<span>💬 KralNet IRC: #KralFM</span>
</div>
<button id="soundToggle" class="sound-toggle-btn">🔔 Ses Açık</button>
</header>

<div class="irc-container">
<!-- Sol Panel: IRC Kanalları ve Kullanıcılar -->
<div class="irc-sidebar" id="sidebar">
<div class="sidebar-section">
<h3>Kanallar</h3>
<ul class="channel-list">
<li class="active">#KralFM</li>
<li>#Muhabbet</li>
<li>#Nostalji</li>
<li>#DJ-Istek</li>
</ul>
</div>
<div class="sidebar-section" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
<h3>Kullanıcılar (<span id="userCount">0</span>)</h3>
<ul class="user-list" id="userList">
<!-- Dinamik dolacak -->
</ul>
</div>
</div>

<!-- Sağ Panel: Radyo ve Sohbet Akışı -->
<div class="irc-main">
<div class="radio-mini-bar">
<div class="radio-info">
<span class="live-dot"></span> <span>Radyo Kral FM Canlı Yayın</span>
</div>
<button type="button" class="mini-play-btn" id="toggleRadio">📻 Radyoyu Dinle</button>
</div>

<div id="messages"></div>

<form id="chatForm" class="irc-input-bar" autocomplete="off">
<input type="text" id="text" maxlength="350" placeholder="Mesaj yazın veya IRC komutu girin (Örn: /nick YeniAd)" required>
<button type="submit">Gönder</button>
</form>
</div>
</div>

<!-- İlk Giriş Nick / Rumuz Popup'ı -->
<div id="nickModal" class="modal-overlay" style="display:flex;">
<div class="modal-box">
<h3>Rumuzu Belirle</h3>
<p style="font-size:13px; color:#aaa;">Sohbete bağlanmak için geçerli bir rumuz (nick) girin:</p>
<input type="text" id="modalNick" placeholder="Rumith (Örn: KralDinleyici)" maxlength="20" required>
<button type="button" id="saveNickBtn" style="width:100%; margin-top:10px; background:#e00000; border:0; color:#fff; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">Sohbete Bağlan</button>
</div>
</div>

<audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyDvfuuPnoBVhBNyMg1n0iBfsY9J29IwbzA",
authDomain: "kralfm-muhabbet.firebaseapp.com",
databaseURL: "https://kralfm-muhabbet-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "kralfm-muhabbet",
storageBucket: "kralfm-muhabbet.firebasestorage.app",
messagingSenderId: "638769846511",
appId: "1:638769846511:web:f6d8abb91564873996"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messagesRef = ref(db, "irc_messages");

let currentNick = "";
let isSoundEnabled = true;
const box = document.getElementById("messages");
const notifyAudio = document.getElementById("notificationSound");

// UI elementleri
const soundToggleBtn = document.getElementById("soundToggle");
const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");
const nickModal = document.getElementById("nickModal");
const modalNick = document.getElementById("modalNick");
const saveNickBtn = document.getElementById("saveNickBtn");
const chatForm = document.getElementById("chatForm");
const textInput = document.getElementById("text");
const toggleRadioBtn = document.getElementById("toggleRadio");

soundToggleBtn.addEventListener("click", () => {
isSoundEnabled = !isSoundEnabled;
soundToggleBtn.textContent = isSoundEnabled ? "🔔 Ses Açık" : "🔕 Sessiz";
});

menuToggle.addEventListener("click", () => {
sidebar.classList.toggle("open");
});

toggleRadioBtn.addEventListener("click", () => {
window.open("http://kralfm.radio12345.com/", "_blank");
});

// Nick kaydetme ve IRC'ye giriş
saveNickBtn.addEventListener("click", () => {
const nick = modalNick.value.trim();
if (!nick) {
alert("Lütfen bir rumuz yazın!");
return;
}
currentNick = nick;
nickModal.style.display = "none";
initIrcSession();
});

modalNick.addEventListener("keypress", (e) => {
if (e.key === "Enter") saveNickBtn.click();
});

function getTimeString() {
return new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

async function initIrcSession() {
appendSystemMessage(*** Oturum açıldı. IRC Sunucusuna bağlanıldı.);
appendSystemMessage(*** Kanal: #KralFM | Rumuz: ${currentNick}`);

await push(messagesRef, {
type: "system",
text: ***${currentNick} kanala giriş yaptı.`,
createdAt: Date.now()
});
}

function appendSystemMessage(txt) {
const div = document.createElement("div");
div.className = "msg system-msg";
div.innerHTML = <span class="time"&gt;[${getTimeString()}]</span> ${txt};
box.appendChild(div);
box.scrollTop = box.scrollHeight;
}

function showMessage(d) {
if (!d) return;
const div = document.createElement("div");
const timeStr = <span class="time"&gt;[${new Date(d.createdAt || Date.now()).toLocaleTimeString("tr-TR", {hour:'2-digit', minute:'2-digit'})}]</span>`;

if (d.type === "system") {
div.className = "msg system-msg";
div.innerHTML = ${timeStr} $`{d.text}`; } else if (d.type === "action") { div.className = "msg action-msg"; div.innerHTML =${timeStr} * <b> {d.text}; } else { div.className = "msg"; div.innerHTML =latex
{timeStr} &lt;&lt;b style="color: #ff5555;"&gt;

{d.name}</b>> ${d.text};
if (isSoundEnabled && d.name !== currentNick) {
notifyAudio.currentTime = 0;
notifyAudio.play().catch(()=>{});
}
}

box.appendChild(div);
box.scrollTop = box.scrollHeight;
}

// IRC Komut Ayrıştırıcı (Parser)
chatForm.addEventListener("submit", async (e) => {
e.preventDefault();
let val = textInput.value.trim();
if (!val || !currentNick) return;

if (val.startsWith("/")) {
const args = val.split(" ");
const cmd = args[0].toLowerCase();
const param = args.slice(1).join(" ");

switch (cmd) {
case "/nick":
if (!param) {
appendSystemMessage("*** Kullanım: /nick <yeni_rumuz>");
} else {
const oldNick = currentNick;
currentNick = param;
await push(messagesRef, { type: "system", text: ***${oldNick} rumuzunu latex
{currentNick} olarak değiştirdi.`, createdAt: Date.now() }); } break; case "/me": if (!param) { appendSystemMessage("*** Kullanım: /me &lt;eylem&gt;"); } else { await push(messagesRef, { name: currentNick, text: param, type: "action", createdAt: Date.now() }); } break; case "/clear": box.innerHTML = ""; break; case "/help": appendSystemMessage("*** Geçerli IRC Komutları: /nick &lt;rumuz&gt;, /me &lt;eylem&gt;, /clear, /help"); break; default: appendSystemMessage(`*** Bilinmeyen komut: 

{cmd}. Yardım için /help yazın.`);
break;
}
} else {
// Normal Kanal Mesajı
await push(messagesRef, {
name: currentNick,
text: val,
type: "chat",
createdAt: Date.now()
});
}

textInput.value = "";
});

onChildAdded(messagesRef, snapshot => {
showMessage(snapshot.val());
});
</script>
</body>
</html>
