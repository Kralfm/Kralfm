<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kral FM Muhabbet</title>

<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
header{background:#b00000;padding:18px;text-align:center;font-size:24px;font-weight:bold}
main{max-width:760px;margin:auto;padding:15px}
.card{background:#1e1e1e;border-radius:14px;padding:15px;margin-bottom:15px}

/* --- Havalı Radyo Görseli ve Oynatıcı Stilleri --- */
.radio-player-card {
  background: linear-gradient(135deg, #1c0202 0%, #2b0808 100%);
  border: 1px solid #800000;
  box-shadow: 0 4px 15px rgba(224, 0, 0, 0.2);
  text-align: center;
}
.radio-header-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.4);
  padding: 12px 18px;
  border-radius: 12px;
  margin-bottom: 12px;
}
.radio-title {
  font-size: 20px;
  font-weight: bold;
  color: #ff4d4d;
  display: flex;
  align-items: center;
  gap: 8px;
}
.live-badge {
  background: #e00000;
  color: #fff;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 12px;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* Dönen Plak ve Ses Barları Visualizer */
.visualizer-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin: 15px 0;
}
.disc {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: radial-gradient(circle, #ff0000 15%, #111 16%, #111 38%, #e00000 39%, #222 100%);
  border: 3px solid #ff4d4d;
  box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
  animation: spin 4s linear infinite paused;
}
.disc.playing {
  animation-play-state: running;
}
@keyframes spin {
  100% { transform: rotate(360deg); }
}

.equalizer {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 35px;
}
.bar {
  width: 5px;
  background: #e00000;
  height: 6px;
  border-radius: 3px;
  transition: height 0.2s;
}
.playing .bar {
  animation: eq 0.8s ease-in-out infinite alternate;
}
.bar:nth-child(1) { animation-delay: 0.1s; }
.bar:nth-child(2) { animation-delay: 0.4s; }
.bar:nth-child(3) { animation-delay: 0.2s; }
.bar:nth-child(4) { animation-delay: 0.5s; }
.bar:nth-child(5) { animation-delay: 0.3s; }
@keyframes eq {
  0% { height: 6px; background: #800000; }
  100% { height: 35px; background: #ff5555; box-shadow: 0 0 8px #ff5555; }
}

.play-btn {
  width: 100%;
  padding: 14px;
  font-size: 17px;
  background: linear-gradient(180deg, #ff1a1a 0%, #b30000 100%);
  border: 0;
  border-radius: 10px;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  transition: transform 0.1s, background 0.2s;
}
.play-btn:active { transform: scale(0.98); }

/* --- Sohbet Stilleri --- */
#messages{height:52vh;overflow:auto;background:#0b0b0b;border-radius:10px;padding:10px}
.msg{background:#292929;border-radius:9px;padding:9px;margin:7px 0;word-break:break-word}
.msg.bot-msg{background:#1a2a3a;border:1px solid #0088cc}
.msg.system-msg{background:#222;border:1px dashed #555;color:#aaa;font-style:italic;font-size:13px;text-align:center}
.time{font-size:11px;color:#888;margin-right:6px}
.avatar{margin-right:4px;font-size:16px}
.name{font-weight:bold;color:#ff5555;margin-right:6px}
.bot-name{color:#00aaff !important}
form{display:flex;gap:7px;margin-top:10px;align-items:center}
select#userAvatar{padding:10px 6px;border:0;border-radius:8px;font-size:18px;background:#2a2a2a;color:#fff;cursor:pointer}
input[type="text"]{flex:1;min-width:0;padding:12px;border:0;border-radius:8px;font-size:16px;background:#2a2a2a;color:#fff}
input[type="color"]{width:45px;height:45px;border:0;padding:0;background:none;cursor:pointer;border-radius:8px;overflow:hidden}
input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
input[type="color"]::-webkit-color-swatch{border:2px solid #444;border-radius:8px}
button{border:0;border-radius:8px;padding:12px 15px;background:#e00000;color:#fff;font-weight:bold;cursor:pointer;white-space:nowrap}
#clear{margin-top:12px;background:#444}
.note{color:#aaa;font-size:13px}
.external-link {display:inline-block; margin-top:10px; color:#ff7777; text-decoration:none; font-size:12px;}
</style>
</head>

<body>

<header>🎙️ Kral FM Muhabbet</header>

<main>
<!-- 📻 Havalı Görselli Canlı Radyo Çalar -->
<div class="card radio-player-card">
  <div class="radio-header-box">
    <span class="radio-title">📻 Kral FM <span style="font-size:13px; color:#aaa;">(İlaç Gibi Radyo)</span></span>
    <span class="live-badge">🔴 CANLI YAYIN</span>
  </div>

  <div class="visualizer-container" id="visualizer">
    <div class="disc" id="radioDisc"></div>
    <div class="equalizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <!-- Gizli Ses Akışı -->
  <audio id="radioAudio" preload="none" src="https://ssllive.kralfm.com.tr/kralfm/kralfm.stream/playlist.m3u8"></audio>

  <button type="button" class="play-btn" id="toggleRadio">▶ Radyoyu Başlat</button>
  <br>
  <a href="http://kralfm.radio12345.com/" target="_blank" rel="noopener" class="external-link">🔗 Harici Sekmede Aç</a>
</div>

<div class="card">
  <h2>💬 Canlı Muhabbet</h2>
  <div id="messages"></div>

  <form id="chatForm">
    <!-- Avatar Seçimi -->
    <select id="userAvatar" title="Avatarınızı Seçin">
      <option value="🎧">🎧</option>
      <option value="📻">📻</option>
      <option value="🎙️">🎙️</option>
      <option value="🎵">🎵</option>
      <option value="👑">👑</option>
      <option value="🕶️">🕶️</option>
      <option value="💃">💃</option>
      <option value="🕺">🕺</option>
      <option value="🎸">🎸</option>
      <option value="🌟">🌟</option>
      <option value="🔥">🔥</option>
      <option value="☕">☕</option>
    </select>
    
    <input type="color" id="userColor" value="#ff5555" title="İsim Renginizi Seçin">
    <input type="text" id="name" maxlength="30" placeholder="Adınız" required>
    <input type="text" id="text" maxlength="300" placeholder="Mesajınız" required>
    <button type="submit">Gönder</button>
  </form>

  <button id="clear" type="button">🗑️ Ekranı Temizle</button>
  <p id="status" class="note">Bağlanıyor...</p>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  query,
  orderByChild,
  startAt,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDvfuuPnoBVhBNyMg1n0iBfsY9J29IwbzA",
  authDomain: "kralfm-muhabbet.firebaseapp.com",
  databaseURL: "https://kralfm-muhabbet-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kralfm-muhabbet",
  storageBucket: "kralfm-muhabbet.firebasestorage.app",
  messagingSenderId: "638769846511",
  appId: "1:638769846511:web:f6d8abb91564873996"
};

const db = getDatabase(initializeApp(firebaseConfig));
const messagesRef = ref(db, "messages");
const box = document.getElementById("messages");
const status = document.getElementById("status");
const nameInput = document.getElementById("name");
const colorInput = document.getElementById("userColor");
const avatarInput = document.getElementById("userAvatar");

// --- RADYO OYNATICI VE ANİMASYON KONTROLÜ ---
const radioAudio = document.getElementById("radioAudio");
const toggleRadioBtn = document.getElementById("toggleRadio");
const radioDisc = document.getElementById("radioDisc");
const visualizer = document.getElementById("visualizer");

let isPlaying = false;

toggleRadioBtn.addEventListener("click", () => {
  if (!isPlaying) {
    radioAudio.play().then(() => {
      isPlaying = true;
      toggleRadioBtn.textContent = "⏸️ Radyoyu Durdur";
      toggleRadioBtn.style.background = "linear-gradient(180deg, #444 0%, #222 100%)";
      radioDisc.classList.add("playing");
      visualizer.classList.add("playing");
    }).catch(err => {
      // Doğrudan M3U8 veya harici yayın desteği
      window.open("http://kralfm.radio12345.com/", "_blank");
    });
  } else {
    radioAudio.pause();
    isPlaying = false;
    toggleRadioBtn.textContent = "▶ Radyoyu Başlat";
    toggleRadioBtn.style.background = "linear-gradient(180deg, #ff1a1a 0%, #b30000 100%)";
    radioDisc.classList.remove("playing");
    visualizer.classList.remove("playing");
  }
});

let hasJoined = false;
let currentDisconnectRef = null;

// Saat Formatlama Fonksiyonu
function getTimeString(timestamp) {
  const date = timestamp ? new Date(timestamp) : new Date();
  return date.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
}

function showMessage(d, isBot = false) {
  const r = document.createElement("div");
  const timeSpan = document.createElement("span");
  
  timeSpan.className = "time";
  timeSpan.textContent = `[${getTimeString(d.createdAt)}] `;

  if (d.type === "system") {
    r.className = "msg system-msg";
    r.textContent = `${timeSpan.textContent} ${d.text}`;
    box.appendChild(r);
    box.scrollTop = box.scrollHeight;
    return;
  }

  const avatarSpan = document.createElement("span");
  avatarSpan.className = "avatar";
  avatarSpan.textContent = isBot ? "🤖 " : `${d.avatar || "🎧"} `;

  const n = document.createElement("span");
  const t = document.createElement("span");

  r.className = isBot ? "msg bot-msg" : "msg";
  n.className = isBot ? "name bot-name" : "name";
  
  if(!isBot && d.color) {
    n.style.color = d.color;
  }

  n.textContent = (d.name || "Misafir") + ": ";
  t.textContent = d.text || "";

  r.append(timeSpan, avatarSpan, n, t);
  box.appendChild(r);
  box.scrollTop = box.scrollHeight;
}

function getBotReply(text) {
  const m = text.toLocaleLowerCase("tr-TR").trim();

  if(m.includes("aşk_dr") || m.includes("aşk dr")) return "❤️ Aşk_dr'a kocaman selamlar! 🎙️👏";
  if(m.includes("bravo") && (m.includes("yayıncı") || m.includes("yayinci"))) return "👏👏 Bravo yayıncımız! Süpersin! 🎉";
  if(m.includes("teşekkür") && (m.includes("yayıncı") || m.includes("yayinci"))) return "❤️ Emeğine sağlık yayıncımız!";
  if(m.includes("yayıncı") || m.includes("yayinci")) return "🎙️ Yayıncımıza kocaman alkışlar! 👏👏👏";
  if(m.includes("alkış") || m.includes("alkis") || m.includes("👏")) return "👏👏👏 Alkışlar yayıncımıza! Harika yayın! 🎙️📻";
  if(m.includes("dans")) return "💃🕺 Haydi piste!";
  if(m.includes("gül") || m.includes("gul")) return "😂😂 Ben de güldüm!";
  if(m.includes("kalp") || m.includes("❤️")) return "❤️ Kral FM sevgisi!";
  if(m.includes("kahve")) return "☕ Kahveler hazır!";
  if(m.includes("uyku")) return "😴 Botun pili azalıyor...";
  if(m.includes("selam") || m.includes("merhaba")) return "👋 Selam! Kral FM Muhabbet'e hoş geldin!";
  if(m.includes("radyo")) return "📻 Kral FM yayında! 🎶";
  if(m.includes("bot")) return "🤖 Ben Kral FM Eğlence Botu! Buradayım!";
  if(m === "yardım" || m === "yardim") return "❓ Komutlar: selam, alkış, yayıncı, Aşk_dr, bravo yayıncı, teşekkürler yayıncı, dans, gül, kalp, kahve, uyku, radyo, bot";

  return null;
}

// Odaya Giriş Bildirimi Gönderme
async function announceJoin(username) {
  if (hasJoined || !username) return;
  hasJoined = true;

  await push(messagesRef, {
    text: `🚪 ${username} sohbet odasına katıldı.`,
    type: "system",
    createdAt: Date.now()
  });

  const leaveMsgRef = push(messagesRef);
  currentDisconnectRef = onDisconnect(leaveMsgRef);
  currentDisconnectRef.set({
    text: `🚪 ${username} sohbet odasından ayrıldı.`,
    type: "system",
    createdAt: Date.now()
  });
}

// Sayfanın açıldığı anı al
const pageStartTime = Date.now();

// Sadece sayfa açıldıktan sonra gelen canlı mesajları dinle
onChildAdded(
  query(messagesRef, orderByChild("createdAt"), startAt(pageStartTime)),
  s => {
    const d = s.val() || {};
    showMessage(d);
  }
);

status.textContent = "Sohbet hazır. 🤖";

// Mesaj Gönderme
document.getElementById("chatForm").addEventListener("submit", async e => {
  e.preventDefault();

  const n = nameInput.value.trim();
  const c = colorInput.value;
  const a = avatarInput.value;
  const t = document.getElementById("text").value.trim();

  if(!n || !t) return;

  if (!hasJoined) {
    await announceJoin(n);
  }

  try {
    await push(messagesRef, {
      name: n.slice(0, 30),
      color: c,
      avatar: a,
      text: t.slice(0, 300),
      createdAt: Date.now()
    });

    document.getElementById("text").value = "";

    const reply = getBotReply(t);
    if(reply) {
      setTimeout(() => {
        showMessage({ name: "Kral FM Bot 🤖", text: reply, createdAt: Date.now() }, true);
      }, 400);
    }

  } catch(e) {
    status.textContent = "Mesaj gönderilemedi.";
  }
});

// Ekranı temizleme
document.getElementById("clear").addEventListener("click", () => {
  box.innerHTML = "";
  status.textContent = "Ekran temizlendi.";
});
</script>

</body>
</html>
